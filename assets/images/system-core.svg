      <stop offset=".94" stop-color="#ecf9ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#7394ad" stop-opacity=".28"/>
    </radialGradient>
    <linearGradient id="blue" x1="150" y1="130" x2="440" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b7eaff"/>
      <stop offset=".27" stop-color="#39b2ff"/>
      <stop offset=".5" stop-color="#047bdc"/>
      <stop offset=".83" stop-color="#06538e"/>
      <stop offset="1" stop-color="#002e5b"/>
