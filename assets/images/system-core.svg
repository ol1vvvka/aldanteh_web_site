    @keyframes flow { 0%,100% { transform: rotate(-10deg) scale(.97,1.03); }50% { transform: rotate(16deg) scale(1.03,.97); } }
    @media (prefers-reduced-motion:reduce) { .fluid-core { animation:none; } }
  </style>
  <defs>
